name: Update listings

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-listings
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install the engine's packages
        run: npm ci

      - name: Check the collector and the engine
        run: |
          python -m unittest discover -s scraper -p "test_*.py"
          node --test server/auth-email.test.js server/engine.test.js

      - name: Collect open opportunities and save them to the database
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BILLING_DISABLED: ${{ vars.GEMINI_BILLING_DISABLED }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: python scraper/collect.py --previous database --out site/data/opportunities.json

      - uses: actions/upload-artifact@v4
        with:
          name: opportunities
          path: site/data/opportunities.json
          retention-days: 7
